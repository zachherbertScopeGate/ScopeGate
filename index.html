<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ScopeGate — Instant Estimate</title>
  <meta name="description" content="Get an instant electrical estimate. Confirm to send to a contractor." />
  <style>
    :root{
      --bg:#0b0f1a; --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
      --txt:rgba(255,255,255,.92); --mut:rgba(255,255,255,.68);
      --r:18px; --sh:0 18px 60px rgba(0,0,0,.45); --max:980px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:var(--txt);
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(72,125,255,.35), transparent 55%),
        radial-gradient(900px 500px at 80% 10%, rgba(255,155,60,.25), transparent 55%),
        var(--bg);
      line-height:1.45;
    }
    .wrap{max-width:var(--max); margin:0 auto; padding:28px 18px 60px;}
    .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh);}
    header{display:flex; justify-content:space-between; align-items:center; gap:14px; padding:10px 0 22px;}
    .brand{display:flex; align-items:center; gap:12px; font-weight:800;}
    .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,rgba(72,125,255,.95),rgba(255,155,60,.85))}
    .pill{border:1px solid var(--line); padding:10px 14px; border-radius:999px; background:rgba(255,255,255,.04); color:var(--mut); font-size:14px;}
    h1{margin:0 0 8px; font-size:clamp(28px,4vw,44px);}
    .sub{margin:0 0 16px; color:var(--mut);}
    .grid{display:grid; gap:14px; grid-template-columns:1.1fr .9fr;}
    @media(max-width:900px){.grid{grid-template-columns:1fr}}
    .pad{padding:18px;}
    label{font-size:13px; color:var(--mut);}
    input,select,textarea{
      width:100%; padding:12px; border-radius:14px;
      border:1px solid var(--line); background:rgba(0,0,0,.22);
      color:var(--txt);
    }
    textarea{min-height:110px;}
    .row2{display:grid; gap:12px; grid-template-columns:1fr 1fr;}
    @media(max-width:700px){.row2{grid-template-columns:1fr}}
    .btn{
      border:0; cursor:pointer;
      padding:12px 16px; border-radius:14px;
      font-weight:800;
      background:linear-gradient(135deg,rgba(72,125,255,.95),rgba(255,155,60,.9));
      color:#0b0f1a;
    }
    .btn2{
      padding:12px 16px; border-radius:14px;
      background:rgba(255,255,255,.06);
      color:var(--txt); border:1px solid var(--line);
      font-weight:800; cursor:pointer;
    }
    .quoteBox{
      padding:14px; border-radius:16px;
      border:1px solid rgba(85,255,190,.35);
      background:rgba(85,255,190,.08);
    }
    .big{font-size:22px; font-weight:900;}
    .hidden{display:none;}
    footer{margin-top:22px; text-align:center; color:rgba(255,255,255,.55); font-size:13px;}
  </style>
</head>

<body>
<div class="wrap">
<header>
  <div class="brand"><div class="logo"></div><div>ScopeGate</div></div>
  <div class="pill">Estimate → Confirm → Sent</div>
</header>

<div class="card pad">
  <h1>Get an instant estimate</h1>
  <p class="sub">Generate a rough range. Only confirmed quotes are sent to the contractor.</p>
</div>

<div class="grid" style="margin-top:14px;">
<div class="card pad">
  <h2>Step 1 — Project</h2>

  <div class="row2">
    <div><label>Name</label><input id="name"></div>
    <div><label>Postal Code</label><input id="postal"></div>
  </div>

  <div class="row2" style="margin-top:12px;">
    <div>
      <label>Project Type</label>
      <select id="type">
        <option disabled selected>Select</option>
        <option value="basement">Basement</option>
        <option value="panel">Panel Upgrade</option>
        <option value="ev">EV Charger</option>
        <option value="lights">Lighting</option>
        <option value="service">Service Call</option>
      </select>
    </div>
    <div>
      <label>Access</label>
      <select id="access">
        <option value="easy">Easy</option>
        <option value="normal">Normal</option>
        <option value="hard">Hard</option>
      </select>
    </div>
  </div>

  <div style="margin-top:12px;">
    <label>Details</label>
    <textarea id="details"></textarea>
  </div>

  <button class="btn" style="margin-top:14px;" id="calc">Generate Estimate</button>
</div>

<div class="card pad">
  <h2>Step 2 — Estimate</h2>

  <div id="quote" class="hidden">
    <div class="quoteBox">
      <div class="big" id="range"></div>
    </div>

    <form id="confirmForm"
      action="https://formspree.io/f/xnjbanbn"
      method="POST"
      style="margin-top:14px;"
    >
      <label>Email (required to confirm)</label>
      <input type="email" name="customer_email" required>

      <input type="hidden" name="name" id="h_name">
      <input type="hidden" name="postal" id="h_postal">
      <input type="hidden" name="project" id="h_project">
      <input type="hidden" name="details" id="h_details">
      <input type="hidden" name="estimate" id="h_estimate">
      <input type="hidden" name="_subject" value="ScopeGate CONFIRMED Quote">

      <div style="display:flex; gap:12px; margin-top:12px;">
        <button class="btn" type="submit">Confirm & Send</button>
        <button class="btn2" type="button" onclick="deny()">Deny</button>
      </div>
    </form>
  </div>

  <div id="placeholder">Generate an estimate first.</div>
</div>
</div>

<footer>© ScopeGate</footer>
</div>

<script>
const ranges = {
  basement:[2500,9000],
  panel:[1800,4500],
  ev:[900,2600],
  lights:[600,3500],
  service:[180,650]
};

document.getElementById("calc").onclick = () => {
  const type = document.getElementById("type").value;
  if(!ranges[type]) return alert("Select project type");

  const r = ranges[type];
  const range = `$${r[0].toLocaleString()} – $${r[1].toLocaleString()}`;

  document.getElementById("range").textContent = range;
  document.getElementById("quote").classList.remove("hidden");
  document.getElementById("placeholder").style.display="none";

  h_name.value = name.value;
  h_postal.value = postal.value;
  h_project.value = type;
  h_details.value = details.value;
  h_estimate.value = range;
};

function deny(){
  alert("Nothing sent.");
}
</script>
</body>
</html>
