<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScopeGate Demo</title>

<style>
:root{
  --bg:#070a11;
  --card:#121826;
  --border:rgba(255,255,255,.12);
  --text:rgba(255,255,255,.92);
  --muted:rgba(255,255,255,.65);
  --accent:#f4a62a;
  --accent2:#ffbf57;
  --radius:16px;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1000px 600px at 20% 10%, rgba(70,130,255,.25), transparent 60%),
    radial-gradient(900px 600px at 80% 15%, rgba(255,165,0,.18), transparent 60%),
    var(--bg);
}

/* ===== PAGE CONTENT ===== */

.container{
  max-width:1000px;
  margin:120px auto;
  padding:0 24px;
}

h1{
  font-size:42px;
  margin-bottom:16px;
}

.cards{
  display:flex;
  gap:20px;
  margin-top:40px;
}

.card{
  flex:1;
  background:var(--card);
  padding:24px;
  border-radius:var(--radius);
  border:1px solid var(--border);
}

/* ===== FLOATING BUTTON ===== */

#sg-launcher{
  position:fixed;
  right:22px;
  bottom:22px;
  background:var(--accent);
  color:#111;
  border:none;
  padding:14px 20px;
  border-radius:999px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  z-index:9999;
}

#sg-launcher:hover{
  background:var(--accent2);
}

/* ===== SIDE WIDGET (NOT MODAL) ===== */

#sg-panel{
  position:fixed;
  right:-400px;
  bottom:90px;
  width:360px;
  max-width:calc(100vw - 40px);
  height:560px;
  max-height:calc(100vh - 120px);
  background:#0f1523;
  border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:0 25px 70px rgba(0,0,0,.6);
  transition:.3s ease;
  z-index:9998;
  display:flex;
  flex-direction:column;
}

#sg-panel.open{
  right:22px;
}

/* HEADER */
.sg-header{
  padding:16px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:600;
}

.sg-close{
  background:none;
  border:none;
  color:var(--muted);
  font-size:18px;
  cursor:pointer;
}

/* BODY */
.sg-body{
  padding:16px;
  overflow-y:auto;
  flex:1;
}

label{
  font-size:12px;
  color:var(--muted);
}

input, select, textarea{
  width:100%;
  padding:10px;
  margin-top:4px;
  margin-bottom:12px;
  background:#121a2b;
  border:1px solid var(--border);
  border-radius:8px;
  color:white;
}

textarea{
  resize:none;
}

button.primary{
  width:100%;
  padding:12px;
  background:var(--accent);
  border:none;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
  margin-top:10px;
}

button.secondary{
  width:100%;
  padding:10px;
  margin-top:8px;
  background:transparent;
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--muted);
  cursor:pointer;
}

.range-box{
  margin-top:12px;
  padding:10px;
  background:#111a2b;
  border-radius:8px;
  border:1px solid var(--border);
  text-align:center;
  font-weight:600;
}
</style>
</head>

<body>

<div class="container">
  <h1>Stop wasting time on unqualified leads.</h1>
  <p>ScopeGate is a plug-and-play estimate widget for contractor websites.</p>

  <div class="cards">
    <div class="card">Pre-qualifies before the call</div>
    <div class="card">Captures scope + contact</div>
    <div class="card">Feels native on any site</div>
  </div>
</div>

<!-- FLOATING BUTTON -->
<button id="sg-launcher">New project? Get a quick range</button>

<!-- SIDE WIDGET -->
<div id="sg-panel">
  <div class="sg-header">
    <div>Instant Basement Estimate</div>
    <button class="sg-close" onclick="closeWidget()">✕</button>
  </div>

  <div class="sg-body">
    <label>Name</label>
    <input id="name">

    <label>Email (required to confirm)</label>
    <input id="email">

    <label>Basement size (sq ft)</label>
    <input id="size" type="number">

    <label>Ceiling type</label>
    <select id="ceiling">
      <option>Drywall (finished)</option>
      <option>Drop ceiling</option>
      <option>Open joist</option>
    </select>

    <label>Finished or unfinished walls?</label>
    <select id="walls">
      <option>Finished walls</option>
      <option>Unfinished walls</option>
    </select>

    <label>Timeline</label>
    <select id="timeline">
      <option>1–3 months</option>
      <option>3–6 months</option>
      <option>Flexible</option>
    </select>

    <label>Build standard</label>
    <select id="standard">
      <option>Basic</option>
      <option>Standard (most common)</option>
      <option>Premium</option>
    </select>

    <label>Number of bathrooms</label>
    <input id="bathrooms" type="number" min="0" value="0">

    <label>Number of bedrooms</label>
    <input id="bedrooms" type="number" min="0" value="0">

    <label>Extras</label>
    <select id="extras">
      <option>None</option>
      <option>Pot lights</option>
      <option>Kitchen rough-in</option>
      <option>Separate entrance</option>
    </select>

    <label>Description (optional)</label>
    <textarea rows="3"></textarea>

    <button class="primary" onclick="generateEstimate()">Get Estimate</button>

    <div id="range" class="range-box" style="display:none;"></div>

    <button id="confirmBtn" class="primary" style="display:none;">Confirm & Send</button>
    <button id="denyBtn" class="secondary" style="display:none;" onclick="closeWidget()">Not Interested</button>
  </div>
</div>

<script>
const launcher = document.getElementById("sg-launcher");
const panel = document.getElementById("sg-panel");

launcher.onclick = () => panel.classList.add("open");
function closeWidget(){ panel.classList.remove("open"); }

function generateEstimate(){
  const size = parseInt(document.getElementById("size").value) || 0;
  const bathrooms = parseInt(document.getElementById("bathrooms").value) || 0;
  const bedrooms = parseInt(document.getElementById("bedrooms").value) || 0;
  const standard = document.getElementById("standard").value;

  let base = size * 40;
  base += bathrooms * 6000;
  base += bedrooms * 1500;

  if(standard.includes("Premium")) base *= 1.3;
  if(standard.includes("Basic")) base *= .85;

  const low = Math.round(base * .9);
  const high = Math.round(base * 1.15);

  document.getElementById("range").style.display="block";
  document.getElementById("range").innerText =
    `Estimated Range: $${low.toLocaleString()} – $${high.toLocaleString()}`;

  document.getElementById("confirmBtn").style.display="block";
  document.getElementById("denyBtn").style.display="block";
}
</script>

</body>
</html>
